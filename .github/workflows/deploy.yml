name: Deploy to GitHub Pages
on:
  push:
    branches: [dev]   # or main, whichever you want live
permissions:
  contents: write  # Allows pushing commits, tags, and creating releases
  pull-requests: write # Required for PR automation actions
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist   # or web/build for CRA
